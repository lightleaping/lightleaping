<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">김수진 AI Developer</title>
  <desc id="desc">제조 데이터를 모델과 검증 가능한 AI 기능으로 연결하는 AI 개발자 프로필 배너</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151F32"/>
      <stop offset="72%" stop-color="#1D2C49"/>
      <stop offset="100%" stop-color="#3561D8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="290" rx="26" fill="url(#bg)"/>
  <circle cx="1090" cy="-15" r="185" fill="#21AFC4" opacity="0.18"/>
  <circle cx="1160" cy="260" r="145" fill="#3561D8" opacity="0.22"/>
  <rect x="64" y="48" width="8" height="192" rx="4" fill="#21AFC4"/>

  <text x="98" y="98" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="22" font-weight="700" fill="#21AFC4" letter-spacing="2">AI DEVELOPER PORTFOLIO</text>
  <text x="98" y="157" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">김수진 | AI Developer</text>
  <text x="98" y="202" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="23" font-weight="500" fill="#EAF0F7">
    제조 데이터를 분석하고 PyTorch 모델을 구현한 뒤,
  </text>
  <text x="98" y="234" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="23" font-weight="500" fill="#EAF0F7">
    실패 사례를 검증해 FastAPI 기반 AI 기능으로 연결합니다.
  </text>

  <g filter="url(#shadow)">
    <rect x="848" y="74" width="258" height="52" rx="13" fill="#FFFFFF" opacity="0.96"/>
    <text x="977" y="107" text-anchor="middle" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="18" font-weight="800" fill="#151F32">VISION · DATA · NLP</text>
    <rect x="848" y="142" width="258" height="52" rx="13" fill="#21AFC4"/>
    <text x="977" y="175" text-anchor="middle" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">PYTORCH · FASTAPI</text>
  </g>
</svg>