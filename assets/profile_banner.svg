  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151F32"/>
      <stop offset="72%" stop-color="#1D2C49"/>
      <stop offset="100%" stop-color="#3561D8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="-20" r="175" fill="#21AFC4" opacity="0.18"/>
  <circle cx="1160" cy="245" r="132" fill="#3561D8" opacity="0.25"/>
  <rect x="62" y="42" width="8" height="184" rx="4" fill="#21AFC4"/>
  <text x="96" y="88" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#21AFC4" letter-spacing="2">AI DEVELOPER PORTFOLIO</text>
  <text x="96" y="145" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="45" font-weight="800" fill="#FFFFFF">김수진 | AI Developer</text>
  <text x="96" y="188" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="500" fill="#EAF0F7">데이터를 분석하고 AI 모델·검색·Agent 기능을 구현한 뒤,</text>
  <text x="96" y="220" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="22" font-weight="500" fill="#EAF0F7">결과와 한계를 검증해 실제 입력 흐름으로 연결합니다.</text>
