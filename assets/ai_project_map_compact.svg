<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Map</title>
  <desc id="desc">여섯 프로젝트의 입력과 핵심 처리, 결과를 간결하게 보여주는 지도</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#152033" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="388" rx="24" fill="#F5F7F9"/>
  <text x="52" y="54" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="30" font-weight="800" fill="#151F32">AI Project Map</text>
  <text x="52" y="82" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="16" fill="#5F6675">입력 → 핵심 처리 → 확인 가능한 결과</text>

  <!-- row 1 -->
  <g filter="url(#shadow)">
    <rect x="52" y="108" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="52" y="108" width="9" height="105" rx="5" fill="#21AFC4"/>
  </g>
  <text x="78" y="141" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#21AFC4">VISION AI</text>
  <text x="78" y="170" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">표면 결함 분류·탐지</text>
  <text x="78" y="196" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Image → ResNet18 / Faster R-CNN → Metric</text>

  <g filter="url(#shadow)">
    <rect x="426" y="108" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="426" y="108" width="9" height="105" rx="5" fill="#3561D8"/>
  </g>
  <text x="452" y="141" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#3561D8">EQUIPMENT AI</text>
  <text x="452" y="170" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">AI4I 고장 위험 예측</text>
  <text x="452" y="196" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Feature → MLP → Evidence / Trace</text>

  <g filter="url(#shadow)">
    <rect x="800" y="108" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="800" y="108" width="9" height="105" rx="5" fill="#151F32"/>
  </g>
  <text x="826" y="141" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#151F32">NLP AGENT</text>
  <text x="826" y="170" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">제조 품질 분석</text>
  <text x="826" y="196" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Question → Intent / Tool → Evidence</text>

  <!-- row 2 -->
  <g filter="url(#shadow)">
    <rect x="52" y="235" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="52" y="235" width="9" height="105" rx="5" fill="#21AFC4"/>
  </g>
  <text x="78" y="268" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#21AFC4">SENSOR PIPELINE</text>
  <text x="78" y="297" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">다변량 이상 탐지</text>
  <text x="78" y="323" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Sensor → AutoEncoder Pipeline → Score</text>

  <g filter="url(#shadow)">
    <rect x="426" y="235" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="426" y="235" width="9" height="105" rx="5" fill="#3561D8"/>
  </g>
  <text x="452" y="268" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#3561D8">RETRIEVAL · TEAM</text>
  <text x="452" y="297" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">의결서 NLP 검색</text>
  <text x="452" y="323" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Document → Retrieval / Boost → Evidence</text>

  <g filter="url(#shadow)">
    <rect x="800" y="235" width="348" height="105" rx="16" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="800" y="235" width="9" height="105" rx="5" fill="#151F32"/>
  </g>
  <text x="826" y="268" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" font-weight="800" fill="#151F32">ACADEMIC NLP</text>
  <text x="826" y="297" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="21" font-weight="800" fill="#151F32">임상 의학 논문 동향</text>
  <text x="826" y="323" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="15" fill="#5F6675">Papers → Text / Keyword Analysis → Report</text>
</svg>