  <text x="824" y="233" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="800" fill="#151F32">ACADEMIC NLP</text>
  <text x="824" y="260" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="800" fill="#151F32">임상 의학 논문 동향 분석</text>
  <text x="824" y="282" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" fill="#5F6675">Web Scraping · Yearly Keywords · WordCloud</text>
