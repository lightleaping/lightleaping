  </g>
  <text x="448" y="128" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="800" fill="#3561D8">EQUIPMENT AI</text>
  <text x="448" y="156" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="800" fill="#151F32">AI4I 설비 고장 위험 예측</text>
