  <text x="448" y="282" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" fill="#5F6675">Dense Retrieval · Section Boost · Top-5</text>

  <g filter="url(#shadow)">
    <rect x="800" y="204" width="352" height="90" rx="15" fill="#FFFFFF" stroke="#D9E0E8"/>
