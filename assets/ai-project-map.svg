<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Map</title>
  <desc id="desc">Vision, 설비 고장 예측, NLP Agent, 센서 파이프라인, 의결서 검색, 임상 논문 동향 분석을 한눈에 보여주는 지도</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#152033" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="326" rx="22" fill="#F5F7F9"/>
  <text x="48" y="46"
        font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif"
        font-size="28" font-weight="800" fill="#151F32">AI Project Map</text>
  <text x="48" y="70"
        font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif"
        font-size="15" fill="#5F6675">문제 영역 · 핵심 구현 · 대표 결과</text>

  <!-- row 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="92" width="352" height="90" rx="15" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="48" y="92" width="8" height="90" rx="4" fill="#21AFC4"/>
  </g>
  <text x="72" y="121" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="800" fill="#21AFC4">VISION AI</text>
  <text x="72" y="148" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="800" fill="#151F32">표면 결함 분류·객체 탐지</text>
  <text x="72" y="170" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" fill="#5F6675">ResNet18 · Faster R-CNN · F1 / mAP</text>

