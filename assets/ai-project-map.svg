    <rect x="800" y="92" width="8" height="90" rx="4" fill="#151F32"/>
  </g>
  <text x="824" y="121" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="800" fill="#151F32">NLP AGENT</text>
  <text x="824" y="148" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="20" font-weight="800" fill="#151F32">제조 품질 분석 Agent</text>
  <text x="824" y="170" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" fill="#5F6675">Intent · Router · 4 Tools · Evidence</text>

