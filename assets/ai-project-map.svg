<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">AI Project Map</title>
  <desc id="desc">Vision, 설비 예측, NLP Agent, 센서 파이프라인, 문서 검색, 논문 동향 분석 프로젝트를 한눈에 보여주는 지도</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#152033" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="#F5F7F9"/>
  <text x="48" y="48" font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif"
        font-size="28" font-weight="800" fill="#151F32">AI Project Map</text>
  <text x="48" y="74" font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif"
        font-size="15" fill="#5F6675">문제 영역 → 핵심 구현 → 확인 가능한 결과</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="98" width="352" height="94" rx="15" fill="#FFFFFF" stroke="#D9E0E8"/>
    <rect x="48" y="98" width="8" height="94" rx="4" fill="#21AFC4"/>
  </g>
  <text x="72" y="128" font-family="'Noto Sans CJK KR','Malgun Gothic',Arial,sans-serif" font-size="14" font-weight="800" fill="#21AFC4">VISION AI</text>
